<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NETGUARD Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="login" class="login-page">
<div class="login">
  <div class="logo">NET<span>GUARD</span></div>
  <p>INTERNET MONITORING SYSTEM</p>
  <div class="error" id="err" hidden></div>
  <form id="loginForm">
    <label>Username</label>
    <input type="text" name="username" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">LOGIN</button>
  </form>
  <div class="hint">
    <strong>Demo version</strong> with sample data. Try:<br>
    Admin: <code>admin</code> / <code>demo</code><br>
    Technician: <code>technician</code> / <code>demo</code><br>
    Customer: <code>customer</code> / <code>demo</code>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
